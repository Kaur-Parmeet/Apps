<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>IVY App UI</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f4f4f4;
    }
    header {
      background: #4CAF50;
      color: white;
      padding: 1rem;
      text-align: center;
    }
    nav {
      background: #333;
      color: white;
      display: flex;
      justify-content: center;
      gap: 1rem;
      padding: 0.5rem;
    }
    nav a {
      color: white;
      text-decoration: none;
    }
    main {
      padding: 2rem;
      text-align: center;
    }
    .card {
      background: white;
      padding: 1rem;
      margin: 1rem auto;
      max-width: 400px;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }
    footer {
      background: #333;
      color: white;
      text-align: center;
      padding: 1rem;
      margin-top: 2rem;
    }
  </style>
</head>
<body>
  <header>
    <h1>IVY App</h1>
  </header>
  <nav>
    <a href="#">Home</a>
    <a href="#">Features</a>
    <a href="#">About</a>
  </nav>
  <main>
    <div class="card">
      <h2>Welcome to IVY</h2>
      <p>This is a sample UI rendered as static HTML.</p>
      <button onclick="alert('Button clicked!')">Try Me</button>
    </div>
  </main>
  <footer>
    <p>&copy; 2026 IVY App</p>
  </footer>
</body>
</html>
